name: Release E2E

# UiAutomator journeys against the release APK on emulators, recorded on video with numbered step screenshots.
#   build:      pull requests and manual runs build the release configuration (R8, resource shrinking, not debuggable)
#               signed with a throwaway key made for this run; the tag pipeline passes the exact signed APK instead.
#   mocked:     the unmodified APK talks to a host fixture through emulator-only routing and a throwaway CA
#               ("release with mocked backend": UI, storage, tools and protocol, not live model behaviour).
#   live_login: an ordinary emulator checks only the real sign-in page and the browser hand-off ("live login-page check").
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['app/**', 'core/**', 'e2e/**', 'gradle/**', 'scripts/**', 'settings.gradle.kts', 'build.gradle.kts',
            '.github/workflows/release-e2e.yml']
  workflow_call:
    inputs:
      apk-artifact:
        description: 'Artifact holding the exact signed release APK to test (app-release.apk); empty builds one'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Chaquopy compiles and installs Python packages with the app's Python version (3.13).
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.2
        with:
          gradle-version: '8.10.2'
      - name: Take the signed release APK under test
        if: inputs.apk-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.apk-artifact }}
          path: under-test
      - name: Build the release configuration with a throwaway signing key
        if: inputs.apk-artifact == ''
        shell: bash
        run: |
          umask 077
          export DSA_KEYSTORE_PATH="$RUNNER_TEMP/e2e-throwaway.jks"
          DSA_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"; export DSA_KEYSTORE_PASSWORD
          export DSA_KEY_PASSWORD="$DSA_KEYSTORE_PASSWORD" DSA_KEY_ALIAS=e2e
          trap 'rm -f "$DSA_KEYSTORE_PATH"' EXIT
          keytool -genkeypair -keystore "$DSA_KEYSTORE_PATH" -storetype PKCS12 -storepass "$DSA_KEYSTORE_PASSWORD" \
            -keypass "$DSA_KEY_PASSWORD" -alias e2e -keyalg RSA -keysize 2048 -validity 7 \
            -dname "CN=DeepSeek Android E2E throwaway" > /dev/null
          gradle --no-daemon --no-configuration-cache :app:assembleRelease
          mkdir -p under-test
          cp app/build/outputs/apk/release/app-release.apk under-test/app-release.apk
      - name: Build the UiAutomator driver
        run: gradle --no-daemon :e2e:assembleDebug :e2e:assembleDebugAndroidTest
      - name: Check the APK under test (package, SDK levels, permissions, ABIs, not debuggable, signature)
        shell: bash
        run: |
          mkdir -p e2e-apks
          cp under-test/app-release.apk e2e-apks/app-release.apk
          cp e2e/build/outputs/apk/debug/e2e-debug.apk e2e-apks/
          cp e2e/build/outputs/apk/androidTest/debug/e2e-debug-androidTest.apk e2e-apks/
          python3 scripts/check_release_apk.py e2e-apks/app-release.apk --json e2e-apks/release-apk-check.json
          (cd e2e-apks && sha256sum app-release.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-e2e-apks
          path: e2e-apks/
          if-no-files-found: error

  mocked:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            theme: light
            classes: ''
          - api: 35
            theme: dark
            classes: 'app.dsandroid.e2e.BaselineJourneyTest'
          - api: 26
            theme: light
            classes: 'app.dsandroid.e2e.BaselineJourneyTest'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-e2e-apks
          path: e2e-apks
      - name: Confirm the APK is the one the build job checked
        run: cd e2e-apks && sha256sum --check SHA256SUMS.txt
      - name: Install ffprobe for video checks
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg > /dev/null
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the journeys against the release APK (mocked backend)
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # A 1080x2200 panel, so screenshots match the spec even where the shell's screencap ignores `wm size` (API 26).
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1080x2200
          disable-animations: true
          script: bash scripts/run_release_e2e.sh
        env:
          E2E_MODE: mocked
          E2E_API: ${{ matrix.api }}
          E2E_THEME: ${{ matrix.theme }}
          E2E_OUT: e2e-output/mocked-api${{ matrix.api }}-${{ matrix.theme }}
          E2E_CLASSES: ${{ matrix.classes }}
          RELEASE_APK: e2e-apks/app-release.apk
          E2E_APK: e2e-apks/e2e-debug.apk
          E2E_TEST_APK: e2e-apks/e2e-debug-androidTest.apk
      - name: Validate the evidence
        if: always()
        # The full suite (AgentJourneyTest included) must also cover every case in e2e/coverage.json.
        run: python3 -I scripts/check_e2e_evidence.py e2e-output/mocked-api${{ matrix.api }}-${{ matrix.theme }} --mode mocked ${{ matrix.classes == '' && '--coverage e2e/coverage.json' || '' }}
      - name: Upload video, step screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-e2e-mocked-api${{ matrix.api }}-${{ matrix.theme }}
          path: e2e-output/
          if-no-files-found: warn

  live_login:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-e2e-apks
          path: e2e-apks
      - name: Confirm the APK is the one the build job checked
        run: cd e2e-apks && sha256sum --check SHA256SUMS.txt
      - name: Install ffprobe for video checks
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg > /dev/null
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check the real sign-in page and browser hand-off (no fixture, no routing)
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run_release_e2e.sh
        env:
          E2E_MODE: live
          E2E_API: 35
          E2E_OUT: e2e-output/live-api35
          E2E_CLASSES: app.dsandroid.e2e.LiveLoginTest
          RELEASE_APK: e2e-apks/app-release.apk
          E2E_APK: e2e-apks/e2e-debug.apk
          E2E_TEST_APK: e2e-apks/e2e-debug-androidTest.apk
      - name: Validate the evidence
        if: always()
        run: python3 -I scripts/check_e2e_evidence.py e2e-output/live-api35 --mode live
      - name: Upload video, step screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-e2e-live-api35
          path: e2e-output/
          if-no-files-found: warn
