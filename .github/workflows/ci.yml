name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  payload:
    uses: ./.github/workflows/payload.yml
  android:
    needs: payload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Chaquopy compiles and installs Python packages with the app's Python version (3.13).
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.2
        with:
          gradle-version: '8.10.2'
      - name: Take the engine payloads
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dsh-payload-*
          path: payload-download
      - name: Place the payloads for the full flavor (lib/<abi>/libdshpayload.so)
        run: bash scripts/place_payloads.sh payload-download
      - name: Test, lint and assemble (full = official engine, play = Play build)
        run: >-
          gradle --no-daemon :core:test :app:testPlayDebugUnitTest :app:testFullDebugUnitTest :app:lintPlayDebug :app:lintFullDebug
          :app:assemblePlayDebug :app:assembleFullDebug :app:assemblePlayRelease :app:assembleFullRelease
      - name: Check merged release permissions (both flavors)
        run: python3 scripts/check_release_manifest.py
      - name: Check the full APKs carry their own ABI's engine payload, stored
        run: python3 -I scripts/check_full_apk.py app/build/outputs/apk/full/release
      - name: Upload debug APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deepseek-android-debug-apk
          path: |
            app/build/outputs/apk/play/debug/*.apk
            app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deepseek-android-failure-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
          if-no-files-found: ignore
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan working tree for secrets
        run: docker run --rm --network none -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2 dir /repo --no-banner
