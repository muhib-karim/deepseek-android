name: APK release

# v1.0.0 and later: a tag builds and tests the release, signs it with the project key (required), runs the full Release E2E
# suite on those exact signed bytes, and only then publishes that APK with its checksum. No debug or unsigned APK is
# published.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  payload:
    uses: ./.github/workflows/payload.yml
    with:
      abis: '["arm64-v8a", "x86_64"]'
  validate:
    needs: payload
    runs-on: ubuntu-latest
    outputs:
      apk-artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Chaquopy compiles and installs Python packages with the app's Python version (3.13).
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.2
        with:
          gradle-version: '8.10.2'
      - name: Take the engine payloads
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dsh-payload-*
          path: payload-download
      - name: Place the payloads for the full flavor
        run: bash scripts/place_payloads.sh payload-download
      - name: Test, lint and assemble
        run: >-
          gradle --no-daemon :core:test :app:testPlayDebugUnitTest :app:testFullDebugUnitTest :app:lintPlayDebug :app:lintFullDebug
          :app:assemblePlayRelease :app:assembleFullRelease
      - name: Check merged release permissions
        run: python3 scripts/check_release_manifest.py
      - name: Build the signed release (signing secrets required)
        env:
          DSA_KEYSTORE_BASE64: ${{ secrets.DSA_KEYSTORE_BASE64 }}
          DSA_KEYSTORE_PASSWORD: ${{ secrets.DSA_KEYSTORE_PASSWORD }}
          DSA_KEY_ALIAS: ${{ secrets.DSA_KEY_ALIAS }}
          DSA_KEY_PASSWORD: ${{ secrets.DSA_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$DSA_KEYSTORE_BASE64" || -z "$DSA_KEYSTORE_PASSWORD" || -z "$DSA_KEY_ALIAS" || -z "$DSA_KEY_PASSWORD" ]]; then
            echo "::error::Release signing secrets are missing; a release is never published unsigned."
            exit 1
          fi
          umask 077
          export DSA_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/dsa-signing.XXXXXX")"
          trap 'rm -f "$DSA_KEYSTORE_PATH"' EXIT
          printf '%s' "$DSA_KEYSTORE_BASE64" | base64 --decode > "$DSA_KEYSTORE_PATH"
          gradle --no-daemon --no-configuration-cache :app:assemblePlayRelease :app:assembleFullRelease
          mkdir -p signed
          cp app/build/outputs/apk/play/release/app-play-universal-release.apk signed/app-release.apk
          python3 -I scripts/check_full_apk.py app/build/outputs/apk/full/release
          cp app/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk signed/app-full-arm64-v8a-release.apk
      - name: Check the signed APK (package, version from the tag, SDK levels, permissions, ABIs, not debuggable)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || exit 1
          python3 scripts/check_release_apk.py signed/app-release.apk --version-name "${RELEASE_TAG#v}" --json signed/release-apk-check.json
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --min-sdk-version 26 signed/app-full-arm64-v8a-release.apk
      - name: Upload the signed APK for the Release E2E run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-apk-under-test
          path: signed/app-release.apk
          if-no-files-found: error
      - name: Name the release APK and generate its checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mkdir -p release
          cp signed/app-release.apk "release/deepseek-android-${RELEASE_TAG}-release.apk"
          # Primary download: the official DeepSeek engine build (targetSdk 28, not for Google Play).
          cp signed/app-full-arm64-v8a-release.apk "release/deepseek-android-${RELEASE_TAG}-full-arm64-v8a.apk"
          cd release
          sha256sum ./*.apk > SHA256SUMS.txt
      - name: Upload validated APK
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-apks
          path: release/
          if-no-files-found: error
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deepseek-android-release-failure-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
          if-no-files-found: ignore
  e2e:
    needs: validate
    # The full suite (all journeys, tool coverage) on the exact signed APK that would be published.
    uses: ./.github/workflows/release-e2e.yml
    with:
      apk-artifact: release-apk-under-test
  release:
    needs: [validate, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.validate.outputs.apk-artifact-id }}
          path: release
          merge-multiple: true
      - name: Verify APK checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish APKs and checksums
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            release/deepseek-android-*.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            DeepSeek Android (Unofficial). The APK is the signed, minified release build that passed the unit tests, lint
            and the Release E2E suite in this tag's workflow run (mocked backend plus the live login-page check).
            Verify the download with sha256sum -c SHA256SUMS.txt.
            Not intended for Play distribution. Installs signed with an earlier debug key must be uninstalled first.
