name: Official DeepSeek reference

# Manual only. Downloads the official DeepSeek Android app (com.deepseek.chat) from APKPure, verifies every split
# against the signer digests the publisher lists in chat.deepseek.com/.well-known/assetlinks.json (pinned in
# scripts/fetch_verify_reference.sh and docs/reference/SOURCE.json), installs it unchanged on a disposable emulator and
# captures its screens in light and dark. The APK and its assets never enter the repository or the uploaded artifact.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode to fetch (282 = 2.6.2, pinned with per-split hashes; others are signer-checked only)'
        default: '282'
      api_level:
        description: 'Emulator API level (x86_64 Google APIs image with ARM translation; the app needs API 29+)'
        default: '30'
      require_complete:
        description: 'Fail when signed-in screens are missing (needs the reference-account secrets)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Pillow for redaction and blank-capture checks
        run: python3 -m pip install --disable-pip-version-check pillow==11.0.0
      - name: Fetch and verify the official APK (nothing is installed if this fails)
        env:
          REFERENCE_VERSION_CODE: ${{ inputs.version_code }}
        run: bash scripts/fetch_verify_reference.sh
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and capture on a disposable emulator
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/capture_reference.sh
        env:
          # Optional dedicated test account; without it only signed-out screens are captured and the run is marked incomplete.
          DS_REF_EMAIL: ${{ secrets.DEEPSEEK_REFERENCE_EMAIL }}
          DS_REF_PASSWORD: ${{ secrets.DEEPSEEK_REFERENCE_PASSWORD }}
      - name: Check captures and keep only sanitized files
        id: check
        if: always()
        run: python3 -I scripts/check_reference.py reference-output ${{ inputs.require_complete && '--require-complete' || '' }}
      - name: Upload the sanitized reference
        if: always() && steps.check.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deepseek-official-reference
          path: reference-output/sanitized/
          if-no-files-found: error
      - name: Upload verification reports (no screenshots)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deepseek-official-reference-verification
          path: |
            reference-output/source/
            reference-output/device/
          if-no-files-found: warn
