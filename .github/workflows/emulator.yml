name: Emulator smoke and account screenshots

on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'core/**', 'gradle/**', 'scripts/**', '.github/workflows/emulator.yml']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.2
        with:
          gradle-version: '8.10.2'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke and deterministic account screenshot tests
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/ci_emulator_screenshots.sh
      - name: Validate capture completeness and credential safety
        id: screenshot_safety
        if: always()
        run: python3 scripts/check_screenshot_artifacts.py official-ui-screenshots
      - name: Upload light and dark account screenshots
        if: always() && steps.screenshot_safety.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-ui-screenshots
          path: official-ui-screenshots/
          if-no-files-found: error
      - name: Upload smoke reports and real screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-smoke
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            smoke-screenshots/
          if-no-files-found: ignore
