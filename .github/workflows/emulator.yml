name: Emulator smoke and account screenshots

on:
  workflow_dispatch:
    inputs:
      live_login:
        description: 'Run only the opt-in live check of the real DeepSeek sign-in page (diagnostic, uploads a trace and a screenshot)'
        type: boolean
        default: false
  pull_request:
    paths: ['app/**', 'core/**', 'engine/**', 'gradle/**', 'scripts/**', '.github/workflows/emulator.yml', '.github/workflows/payload.yml']

permissions:
  contents: read

jobs:
  payload:
    if: ${{ !inputs.live_login }}
    uses: ./.github/workflows/payload.yml
    with:
      abis: '["x86_64"]'
  # The official engine (full flavor) on an x86_64 emulator with its own payload.
  engine:
    needs: payload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.2
        with:
          gradle-version: '8.10.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dsh-payload-*
          path: payload-download
      - name: Place the x86_64 payload
        run: bash scripts/place_payloads.sh payload-download
      - name: Build the full debug APK and its tests before the emulator starts
        run: gradle --no-daemon :app:assembleFullDebug :app:assembleFullDebugAndroidTest
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Engine journey (payload node -e, full UI with a fake key, screens)
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disk-size: 8000M
          ram-size: 4096M
          disable-animations: true
          script: bash scripts/ci_engine_emulator.sh
      - name: Upload v1.3.0 screenshots and engine diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v130-screenshots
          path: |
            v130-screenshots/
            engine-diagnostics/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Chaquopy compiles and installs Python packages with the app's Python version (3.13).
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.2
        with:
          gradle-version: '8.10.2'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke and deterministic account screenshot tests
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/ci_emulator_screenshots.sh
        env:
          LIVE_LOGIN: ${{ inputs.live_login && 'true' || 'false' }}
      - name: Validate capture completeness and credential safety
        id: screenshot_safety
        if: always() && !inputs.live_login
        run: python3 scripts/check_screenshot_artifacts.py official-ui-screenshots
      - name: Upload light and dark account screenshots
        if: always() && !inputs.live_login && steps.screenshot_safety.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-ui-screenshots
          path: official-ui-screenshots/
          if-no-files-found: error
      - name: Upload smoke reports and real screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-smoke
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            smoke-screenshots/
          if-no-files-found: ignore
      - name: Upload the live sign-in page trace
        if: always() && inputs.live_login
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-login-diagnostics
          path: live-login/
          if-no-files-found: warn
